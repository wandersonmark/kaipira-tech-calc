
name: Gerar APK Capacitor - Lucro ML v1.4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Encontrar a calculadora
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f www/index.html && -f package.json ]]; then
            APP_DIR="."
          else
            INDEX=$(find . -maxdepth 5 -type f -path '*/www/index.html' -print -quit)
            if [[ -z "$INDEX" ]]; then
              echo 'ERRO: pasta www/index.html nao encontrada.'
              exit 1
            fi
            APP_DIR=$(dirname "$(dirname "$INDEX")")
          fi
          if [[ ! -f "$APP_DIR/package.json" || ! -f "$APP_DIR/capacitor.config.json" ]]; then
            echo 'ERRO: arquivos de configuracao ausentes.'
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Aplicativo encontrado em $APP_DIR"

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar dependencias e testar calculadora
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Gerar projeto Android pelo Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Validar arquivo APK
        shell: bash
        run: |
          APK="$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -2
          echo "APK gerado: $APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: KAIPIRAS-TECH-LUCRO-ML-v1.4-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
